# ============================================================
# LOCAL PROFILE — used when SPRING_PROFILES_ACTIVE=local (default)
# Talks to a MySQL instance running on your own machine.
# All values can be overridden via a .env file (see .env.example).
# ============================================================
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:mysql://${DB_HOST:}:${DB_PORT:3306}/${DB_NAME:elearning_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Safe to let Hibernate manage the schema locally.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changes/db.changelog-master.yaml

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.admin-email=${ADMIN_EMAIL:}

# Local S3 access is optional — if these are blank, S3Config falls back
# to the default AWS credentials provider chain (fine for local testing
# with a personal dev bucket, or leave S3 features untested locally).
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

management.endpoint.health.show-details=always

logging.level.org.springframework.security=DEBUG
logging.level.com.edu.elearning=DEBUG
