# ============================================================
# PRODUCTION PROFILE — used when SPRING_PROFILES_ACTIVE=prod
# All values MUST come from real environment variables set on the
# EC2 instance (see deploy/elearning.service). No secret defaults
# here on purpose — the app fails to start if one is missing,
# instead of silently running with a placeholder/dev secret.
# ============================================================
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is expected to already exist in production. "update" is kept
# for now since there's no Liquibase changelog wired up yet, but the
# safer long-term move is ddl-auto=validate + real migration scripts
# (liquibase-core is already on the classpath, just unused).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.admin-email=${ADMIN_EMAIL}

aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET}
# Prefer NOT setting these two on EC2 — attach an IAM role to the
# instance instead and delete these lines entirely. S3Config already
# falls back to DefaultCredentialsProvider (which reads the instance's
# IAM role) whenever they're blank. Only set them if you're not using
# an instance profile.
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

management.endpoint.health.show-details=when-authorized

logging.level.org.springframework.security=WARN
logging.level.com.edu.elearning=INFO

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changes/db.changelog-master.yaml