spring.application.name=elearning

server.port=${SERVER_PORT:8088}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:e_learning}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


#jwt.secret=${JWT_SECRET:change-this-in-env-do-not-use-in-prod}
#jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY:1200000}
#jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY:86400000}


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin-email=${ADMIN_EMAIL:}


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized


logging.level.org.springframework.security=INFO
logging.level.com.edu.elearning=DEBUG

version=v1