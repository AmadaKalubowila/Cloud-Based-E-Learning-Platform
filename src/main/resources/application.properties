# ============================================================
# COMMON SETTINGS — shared by every profile (local + prod)
# No secrets, no environment-specific values in this file.
# ============================================================
spring.application.name=elearning

# Which profile runs is decided by SPRING_PROFILES_ACTIVE.
# Defaults to "local" so a plain `mvn spring-boot:run` with no
# env var set is always safe and never touches production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# jwt.* properties are informational only right now — JwtUtil reads the
# JWT_SECRET environment variable directly via System.getenv().
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- AWS S3 (video storage) ----
# Real values always come from environment variables — never hardcode here.
aws.s3.presigned-url-expiry-minutes=${AWS_S3_URL_EXPIRY_MIN:60}

management.endpoints.web.exposure.include=health,info,metrics

version=v1
