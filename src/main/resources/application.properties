spring.application.name=elearning

server.port=${SERVER_PORT:8088}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:e_learning}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# jwt.* properties are informational only right now — JwtUtil reads the
# JWT_SECRET environment variable directly via System.getenv().
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:kalubowilaamada20@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
app.admin-email=${ADMIN_EMAIL:amadakalubowila@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ---- AWS S3 (video storage) ----
# All values come from environment variables — never hardcode real keys here.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:elearning-cloud-project-2026}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# How long a generated video playback link stays valid (bucket is private)
aws.s3.presigned-url-expiry-minutes=${AWS_S3_URL_EXPIRY_MIN:60}


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized


logging.level.org.springframework.security=INFO
logging.level.com.edu.elearning=DEBUG

version=v1