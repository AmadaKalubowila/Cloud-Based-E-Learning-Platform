databaseChangeLog:
  # ==================================================
  # COURSE_ASSIGNMENTS
  # ==================================================
  - changeSet:
      id: 008-create-course-assignments
      author: edu-elearning
      changes:
        - createTable:
            tableName: course_assignments
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: lecturer_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: assigned_date
                  type: TIMESTAMP

              - column:
                  name: created_date_time
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: updated_date_time
                  type: TIMESTAMP

              - column:
                  name: version
                  type: INT

              - column:
                  name: status
                  type: VARCHAR(50)

        - addForeignKeyConstraint:
            baseTableName: course_assignments
            baseColumnNames: lecturer_id
            constraintName: fk_course_assignments_lecturer
            referencedTableName: user_details
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: course_assignments
            baseColumnNames: course_id
            constraintName: fk_course_assignments_course
            referencedTableName: courses
            referencedColumnNames: id
