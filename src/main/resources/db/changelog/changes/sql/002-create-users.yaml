databaseChangeLog:
  - changeSet:
      id: 002-create-users
      author: edu-elearning
      changes:
        - createTable:
            tableName: users
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(255)

              - column:
                  name: password
                  type: VARCHAR(255)

              - column:
                  name: role
                  type: VARCHAR(50)

              - column:
                  name: user_details_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: refresh_token
                  type: VARCHAR(500)

              - column:
                  name: last_login_at
                  type: TIMESTAMP

              - column:
                  name: failed_login_attempts
                  type: INT

              - column:
                  name: locked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: reset_token
                  type: VARCHAR(255)

              - column:
                  name: reset_token_expiry
                  type: TIMESTAMP

              - column:
                  name: created_date_time
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: updated_date_time
                  type: TIMESTAMP

              - column:
                  name: version
                  type: INT

              - column:
                  name: status
                  type: VARCHAR(50)


        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: user_details_id
            constraintName: fk_users_user_details
            referencedTableName: user_details
            referencedColumnNames: id
