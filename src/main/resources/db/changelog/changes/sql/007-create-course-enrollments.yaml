databaseChangeLog:
  # ==================================================
  # COURSE_ENROLLMENTS
  # ==================================================
  - changeSet:
      id: 007-create-course-enrollments
      author: edu-elearning
      changes:
        - createTable:
            tableName: course_enrollments
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false


              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: enrolled_date
                  type: TIMESTAMP

              - column:
                  name: progress_percentage
                  type: INT

              - column:
                  name: enrollment_status
                  type: VARCHAR(50)

              - column:
                  name: created_date_time
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: updated_date_time
                  type: TIMESTAMP

              - column:
                  name: version
                  type: INT

              - column:
                  name: status
                  type: VARCHAR(50)

        - addForeignKeyConstraint:
            baseTableName: course_enrollments
            baseColumnNames: student_id
            constraintName: fk_course_enrollments_student
            referencedTableName: user_details
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: course_enrollments
            baseColumnNames: course_id
            constraintName: fk_course_enrollments_course
            referencedTableName: courses
            referencedColumnNames: id
