databaseChangeLog:
  - changeSet:
      id: 003-create-audit-user-log
      author: edu-elearning
      changes:
        - createTable:
            tableName: audit_user_log
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_name
                  type: VARCHAR(255)

              - column:
                  name: action
                  type: VARCHAR(255)

              - column:
                  name: time_stamp
                  type: TIMESTAMP

              - column:
                  name: details
                  type: VARCHAR(1000)

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: audit_user_log
            baseColumnNames: user_id
            constraintName: fk_audit_user_log_user
            referencedTableName: users
            referencedColumnNames: id
